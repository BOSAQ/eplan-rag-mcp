name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-rag-eplan-p8/worker/**"

jobs:
  deploy:
    # Only the upstream repo holds the Cloudflare credentials this deploys with.
    # Without this guard a fork that enables Actions gets a red X on its default
    # branch (both secrets empty), and a fork that happens to have its OWN
    # Cloudflare credentials would deploy a Worker named `eplan-rag-mcp` onto the
    # custom domain from wrangler.jsonc into that account. Skipping elsewhere is
    # the correct outcome in both cases.
    if: github.repository == 'covagashi/eplan-rag-mcp'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-rag-eplan-p8/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
